<button
    type="button"
    class="btn-priority low-prio"
    [class.active-state]="lowIsActive()"
    [class.useInEditTask]="useInEditTask()"
    (click)="toggleActiveState('low')"
>
    <p>{{ btnSrc.get('low')?.[2] }}</p>
    <img [src]="lowIsActive() ? btnSrc.get('low')?.[1] : btnSrc.get('low')?.[0]" />
</button>
