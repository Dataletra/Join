<button
    type="button"
    class="btn-priority low-prio"
    [class.active-state]="lowIsActive()"
    (click)="toggleActiveState('lowPrio')"
>
    <p>{{ btnSrc.get('lowPrio')?.[2] }}</p>
    <img [src]="lowIsActive() ? btnSrc.get('lowPrio')?.[1] : btnSrc.get('lowPrio')?.[0]" />
</button>
