<div class="input-wrapper">
    <input type="text" placeholder="Enter a description" [formControl]="subtaskEntry" />
    @if (subtaskEntry.value) {
        <div class="btn-container">
            <button (click)="confirm()">Yes</button>
            <hr />
            <button (click)="cancel()">No</button>
        </div>
    }
</div>
<ul>
    @for (entry of subtaskItems; track $index) {
        <li class="subtask-item" [attr.id]="'subtask-' + $index">
            <input class="subtask-item-input" type="text" [value]="entry.title" #inputRef [disabled]="true" />
            <div class="btn-entry-container" #btnEditContainer>
                <button (click)="openEdit(btnEditContainer)">edit</button>
                <hr />
                <button (click)="delete($index)">del</button>
            </div>
            <div class="btn-entry-edit-container">
                <button (click)="saveEdit($index, inputRef.value, btnEditContainer)">Aedit</button>
                <hr />
                <button (click)="delete($index)">Adel</button>
            </div>
        </li>
    }
</ul>
