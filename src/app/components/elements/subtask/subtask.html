<div class="input-wrapper">
    <input type="text" placeholder="Enter a description" [formControl]="subtaskEntry" />
    @if (subtaskEntry.value) {
        <div class="btn-container">
            <button (click)="confirm()">Yes</button>
            <hr />
            <button (click)="cancel()">No</button>
        </div>
    }
</div>
<ul>
    @for (entry of subtaskItems; track $index) {
        <li class="subtask-item" [attr.id]="'subtask-' + $index">
            <input class="subtask-item-input" type="text" [value]="entry.title" #inputRef disabled />

            <div class="btn-entry-container" #btnEditContainer>
                <!-- Pass both containers into openEdit -->
                <button (click)="openEdit(btnEditContainer, btnEntryEditContainer, inputRef)">edit</button>
                <hr />
                <button (click)="delete($index)">Delete</button>
            </div>

            <div class="btn-entry-edit-container d-none" #btnEntryEditContainer>
                <button (click)="saveEdit($index, inputRef.value, btnEditContainer, btnEntryEditContainer, inputRef)">
                    Save
                </button>
                <hr />
                <button (click)="delete($index)">Delete</button>
            </div>
        </li>
    }
</ul>
