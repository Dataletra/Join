<div #combobox="ngCombobox" ngCombobox [(expanded)]="popupExpanded" [preserveContent]="true" class="select">
    <span class="combobox-label">
        <span class="selected-label-icon material-symbols-outlined" translate="no" aria-hidden="true">{{
            displayIcon()
        }}</span>
        <span class="selected-label-text">{{ displayValue() }}</span>
    </span>
    <span class="example-arrow material-symbols-outlined" translate="no" aria-hidden="true">arrow_drop_down</span>
</div>

<ng-template
    [cdkConnectedOverlay]="{ origin: combobox.element, usePopover: 'inline', matchWidth: true }"
    [cdkConnectedOverlayOpen]="popupExpanded()"
>
    <ng-template ngComboboxPopup [combobox]="combobox">
        <div class="example-popup-container">
            <div
                #listbox="ngListbox"
                ngListbox
                [multi]="true"
                ngComboboxWidget
                focusMode="activedescendant"
                [tabindex]="-1"
                selectionMode="explicit"
                [(value)]="selectedValues"
                [activeDescendant]="listbox.activeDescendant()"
            >
                <div class="user-list">
                    @for (entry of dbService.groupedUsers().entries(); track entry[0]) {
                        @for (user of entry[1]; track user.id) {
                            <div
                                ngOption
                                [value]="user.name"
                                [label]="user.name"
                                [class.selected]="dbService.selectedUserID() === user.id"
                                class="user-item"
                                [attr.id]="'user-' + user.id"
                            >
                                <app-ic-contact class="user-ic" [name]="user.name"></app-ic-contact>
                                <h5 class="username">
                                    {{ user.name | titlecase }}
                                </h5>
                                <span
                                    class="example-option-check material-symbols-outlined"
                                    translate="no"
                                    aria-hidden="true"
                                    >check</span
                                >
                            </div>
                        }
                    }
                </div>
                <!-- } -->
            </div>
        </div>
    </ng-template>
</ng-template>
