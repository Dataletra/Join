<div class="wrapper">
    <div class="title">
        <h1>Contacts</h1>
        <h2>|</h2>
        <h4>Better with a team</h4>
    </div>
    <div class="detailed-view">
        @if (selectedUser(); as user) {
            @for (u of [user]; track u.id) {
                <div class="user-container">
                    <app-ic-contact class="user-ic" [name]="u.name"></app-ic-contact>
                    <div class="name-container">
                        <h2>{{ selectedUser()?.name | titlecase }}</h2>
                        <div class="button-container"><button>Edit</button><button>Delete</button></div>
                    </div>
                </div>
                <p>Contact Information</p>
                <div class="contact-container">
                    <p>Email</p>
                    <a href="">{{ selectedUser()?.email }}</a>
                    <p>Phone</p>
                    <a href="">{{ selectedUser()?.phone }}</a>
                </div>
            }
        }
    </div>
</div>
