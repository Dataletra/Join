@if (!authentication.isSignedIn()) {
    <section class="log-in" [class.d-none]="authentication.hideLogIn()">
        <header>
            <img src="./assets/icons/logo-dark.svg" aria-hidden="true" />
            <div class="not-a-user">
                @if (mode === 'log-in') {
                    <p>Not a Join user?</p>
                    <app-button-primary (click)="switchToSignUp()" [small]="true">Sign up</app-button-primary>
                }
            </div>
        </header>

        @if (mode === 'log-in') {
            <div class="log-in-wrapper">
                <h2>Log in</h2>
                <hr />

                <form [formGroup]="signUpForm">
                    <div class="inputs inputs-log-in">
                        <input class="input-email" type="email" placeholder="Email" formControlName="name" />
                        <input class="input-password" type="password" placeholder="Password" />
                    </div>
                </form>

                <div class="buttons">
                    <app-button-primary [small]="true" [widthStr]="'110px'">Log in</app-button-primary>

                    <app-button-primary (click)="guestLogIn()" [small]="true" [widthStr]="'117px'" [typeStr]="'light'"
                        >Guest Log in</app-button-primary
                    >
                </div>
            </div>
        } @else {
            <div class="sign-up-wrapper">
                <button (click)="switchToLogIn()" class="back-btn">
                    <img src="./assets/icons/arrow-left.svg" aria-hidden="true" />
                </button>
                <h2>Sign up</h2>
                <hr />

                <div class="inputs inputs-sign-up">
                    <input class="input-name" type="text" placeholder="Name" />
                    <input class="input-email" type="email" placeholder="Email" />
                    <input class="input-password" type="password" placeholder="Password" />
                    <input class="input-password" type="password" placeholder="Confirm Password" />
                </div>

                <div class="privacy-policy">
                    <input type="checkbox" />
                    <p>
                        I accept the
                        <a
                            (click)="authentication.hideLogIn.set(true); navigateService.goTo('privacy-policy')"
                            [class.active]="activeUrl() === '/privacy-policy'"
                            >Privacy Policy</a
                        >
                    </p>
                </div>

                <app-button-primary [small]="true" [widthStr]="'126px'">Sign up</app-button-primary>
            </div>
        }

        <footer>
            <a
                (click)="authentication.hideLogIn.set(true); navigateService.goTo('privacy-policy')"
                [class.active]="activeUrl() === '/privacy-policy'"
                >Privacy Policy</a
            >
            <a
                (click)="authentication.hideLogIn.set(true); navigateService.goTo('legal-notice')"
                [class.active]="activeUrl() === '/legal-notice'"
                >Legal notice</a
            >
        </footer>
    </section>
}
