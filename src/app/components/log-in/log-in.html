<section class="log-in">
    <div class="intro-screen" [class.intro-animation-play]="!introPlayed" [class.d-none]="introPlayed">
        <img src="./assets/icons/logo-dark.svg" class="intro-logo intro-logo-desktop" />
        <img src="./assets/icons/logo.svg" class="intro-logo intro-logo-mobile" />
    </div>

    <header>
        <img
            class="logo"
            [class.logo-animation-play]="!introPlayed"
            src="./assets/icons/logo-dark.svg"
            aria-hidden="true"
        />
        <div class="not-a-user nau-desktop">
            <p>Not a Join user?</p>
            <app-button-primary (click)="navigateService.goTo('sign-up')" [small]="true">Sign up</app-button-primary>
        </div>
    </header>

    <div class="log-in-wrapper">
        <h2>Log in</h2>
        <hr />

        <form [formGroup]="logInForm" (ngSubmit)="logIn()">
            <div class="inputs inputs-log-in">
                <input
                    class="input-email"
                    type="email"
                    placeholder="Email"
                    formControlName="email"
                    (input)="loginError.set(false)"
                />
                <div class="password-input-wrapper">
                    <input
                        class="input-password"
                        placeholder="Password"
                        formControlName="password"
                        (input)="loginError.set(false)"
                        [class.has-value]="logInForm.controls.password.value"
                        [type]="passwordVisible() ? 'text' : 'password'"
                    />

                    @if (logInForm.controls.password.value) {
                        <button type="button" class="password-toggle" (click)="passwordVisible.set(!passwordVisible())">
                            <img
                                [src]="passwordVisible() ? './assets/icons/eye.svg' : './assets/icons/eye-off.svg'"
                                alt="Toggle password visibility"
                            />
                        </button>
                    }
                </div>
                <div class="li-check-wrapper">
                    <p class="form-check" [class.is-visible]="loginError()">
                        @if (loginError()) {
                            Check your email and password. Please try again.
                        }
                    </p>
                </div>
            </div>

            <div class="buttons log-in-buttons">
                <app-button-primary
                    [buttonType]="'submit'"
                    [small]="true"
                    [widthStr]="'110px'"
                    [isDisabled]="logInForm.invalid"
                    >Log in</app-button-primary
                >
                <app-button-primary (click)="guestLogIn()" [small]="true" [widthStr]="'117px'" [typeStr]="'light'"
                    >Guest Log in</app-button-primary
                >
            </div>
        </form>
    </div>

    <div class="not-a-user nau-mobile">
        <p>Not a Join user?</p>
        <app-button-primary (click)="navigateService.goTo('sign-up')" [small]="true">Sign up</app-button-primary>
    </div>

    <footer>
        <a (click)="navigateService.goTo('privacy-policy')">Privacy Policy</a>
        <a (click)="navigateService.goTo('legal-notice')">Legal notice</a>
    </footer>
</section>
