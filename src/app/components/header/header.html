<img class="logo-mobile show-mobile" src="./assets/icons/favicon-dark.svg" alt="join logo" />
<h5 class="header-title">Kanban Project Management Tool</h5>
<nav class="header-nav">
    <button class="btn-help" (click)="goToPage('help')">
        <img src="./assets/icons/help.svg" alt="help-icon" />
    </button>
    <app-ic-contact
        type="button"
        cdkOverlayOrigin
        #origin="cdkOverlayOrigin"
        (click)="toggleMenu()"
        (keyup.enter)="toggleMenu()"
        (keyup.escape)="hideMenu()"
        class="header-user"
        [name]="'TODO NAME'"
        [isHeader]="true"
        tabindex="0"
        ngMenuTrigger
        #trigger="ngMenuTrigger"
        [menu]="headerMenu()"
    ></app-ic-contact>
</nav>
<ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="origin"
    [cdkConnectedOverlayOpen]="overlayListen()"
    (overlayOutsideClick)="hideMenu()"
    (detach)="hideMenu()"
>
    <menu ngMenu #headerMenu="ngMenu" class="user-menu" [class.move-out]="!showMenu()" [class.move-in]="showMenu()">
        <ng-template ngMenuContent >
            <li
                ngMenuItem
                value="help"
                (click)="goToPage('help')"
                (keydown.enter)="goToPage('help')"
                class="help-mobile"
            >
                <a>Help</a>
            </li>
            <li
                ngMenuItem
                value="legal-notice"
                (click)="goToPage('legal-notice')"
                (keydown.enter)="goToPage('legal-notice')"
            >
                <a>Legal Notice</a>
            </li>
            <li
                ngMenuItem
                value="privacy-policy"
                (click)="goToPage('privacy-policy')"
                (keydown.enter)="goToPage('privacy-policy')"
            >
                <a>Privacy Policy</a>
            </li>
            <li ngMenuItem value="logout"><a href="#TODO">Log out</a></li>
        </ng-template>
    </menu>
</ng-template>
