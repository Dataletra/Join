<section class="task-card">
    <div class="lable-wrapper">
        <button class="lable">{{ task().category }}</button>
    </div>
    <div class="task-body">
        <p class="task-title">{{ task().title }}</p>
        <p class="task-description">
            {{ task().description }}
        </p>
    </div>
    @if (task().subtasks.length > 0) {
        <div class="subtasks">
            <div class="progress-bar">
                <div class="progress" [style.width.%]="progress"></div>
            </div>
            <p>{{ completedSubtasks }}/{{ task().subtasks.length }} Subtasks</p>
        </div>
    }
    <div class="task-footer">
        <div class="member">
            @for (user of task().assignedTo.slice(0, 3); track $index) {
                <app-ic-contact
                    class="badge"
                    [name]="user.name"
                    [enableShadow]="false"
                    [isDummy]="false"
                ></app-ic-contact>
            }
            @if (task().assignedTo.length > 3) {
                <app-ic-contact
                    class="badge"
                    [name]="'+' + '(task().assignedTo.length - 3)'"
                    [enableShadow]="false"
                    [isDummy]="false"
                ></app-ic-contact>
            }
        </div>
        <img class="prio" src="./assets/icons/{{ task().priority }}.svg" aria-hidden="true" />
    </div>
</section>
