<section class="task-card">
    <div class="lable-wrapper">
        <button class="lable">{{ task().category }}</button>
    </div>
    <div class="task-body">
        <p class="task-title">{{ task().title }}</p>
        <p class="task-description">
            {{ task().description }}
        </p>
    </div>
    <div class="subtasks">
        <div class="progress-placeholder"></div>
        <p>2/2 Subtasks</p>
    </div>
    <div class="task-footer">
        <div class="member">
            @for (user of task().assignedTo; track $index) {
                <app-ic-contact
                    class="badge"
                    [name]="user.name"
                    [enableShadow]="false"
                    [isDummy]="false"
                ></app-ic-contact>
            }
        </div>

        <img class="prio" src="./assets/icons/{{ task().priority }}.svg" aria-hidden="true" />
    </div>
</section>
